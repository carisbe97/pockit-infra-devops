# Docker Compose — Pockit Finance (Version Camilo)
# Ambientes Mitologicos:
#   - ares   (--profile ares)  : Stack local completo (PostgreSQL + ms-auth-user + api-gateway) para desarrollo rapido.
#   - hermes / zeus            : Despliegue contra Supabase Cloud (:6543 / :5432) en OCI con docker-compose.hermes.yml / docker-compose.zeus.yml.

services:
  pockit-ares-db:
    image: postgres:15-alpine
    container_name: pockit-ares-db
    restart: unless-stopped
    profiles:
      - ares
    environment:
      POSTGRES_DB: ${ARES_DB_NAME:-pockit-ares}
      POSTGRES_USER: ${ARES_DB_USER:-pockit_admin}
      POSTGRES_PASSWORD: ${ARES_DB_PASSWORD:-pockit_ares_dev_2026}
      TZ: UTC
    ports:
      - "${ARES_DB_PORT:-5432}:5432"
    volumes:
      - pockit_ares_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARES_DB_USER:-pockit_admin} -d ${ARES_DB_NAME:-pockit-ares}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pockit-internal-net

  pockit-ms-auth-user:
    build:
      context: ../pockit-ms-auth-user
      dockerfile: Dockerfile
    image: pockit-ms-auth-user:ares
    container_name: pockit-ms-auth-user
    restart: unless-stopped
    profiles:
      - ares
    depends_on:
      pockit-ares-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ares
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://pockit-ares-db:5432/${ARES_DB_NAME:-pockit-ares}
      DB_USERNAME: ${ARES_DB_USER:-pockit_admin}
      DB_PASSWORD: ${ARES_DB_PASSWORD:-pockit_ares_dev_2026}
      FLYWAY_DB_URL: jdbc:postgresql://pockit-ares-db:5432/${ARES_DB_NAME:-pockit-ares}
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD:-pockit-ares-dev-jasypt-master-key}
      JWT_SECRET: ${JWT_SECRET:-pockit-ares-dev-jwt-secret-key-minimo-64-bytes-hs512-solo-desarrollo-local-0123456789}
      JWT_ISSUER: ${JWT_ISSUER:-pockit-ms-auth-user}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000,http://localhost:8080}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_AVATAR_BUCKET: ${SUPABASE_AVATAR_BUCKET:-avatars}
      TZ: UTC
    ports:
      - "${MS_AUTH_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pockit-internal-net

  pockit-api-gateway:
    build:
      context: ../pockit-api-gateway
      dockerfile: Dockerfile
    image: pockit-api-gateway:ares
    container_name: pockit-api-gateway
    restart: unless-stopped
    profiles:
      - ares
    depends_on:
      pockit-ms-auth-user:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ares
      SERVER_PORT: 8080
      MS_AUTH_USER_URI: http://pockit-ms-auth-user:8081
      AUTH_SERVICE_URL: http://pockit-ms-auth-user:8081
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD:-pockit-ares-dev-jasypt-master-key}
      JWT_SECRET: ${JWT_SECRET:-pockit-ares-dev-jwt-secret-key-minimo-64-bytes-hs512-solo-desarrollo-local-0123456789}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
      TZ: UTC
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - pockit-internal-net

networks:
  pockit-internal-net:
    name: pockit-internal-net
    driver: bridge

volumes:
  pockit_ares_pgdata:
    name: pockit_ares_pgdata
